<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <h2 class="logo">FindYourType 🎬</h2>
    </nav>

    <div class="container">

        <div class="search-bar">
            <input type="text" placeholder="Search any movie..." class="input">
            <button class="search-btn">Search</button>
        </div>

        <div class="movie-box">

            <div class="movie-card">
                <img
                    src="https://img.freepik.com/free-photo/movie-background-collage_23-2149876028.jpg">
            </div>

            <div>
                <p class="default-heading">Find your Movie</p>
            </div>

            <div class="info">
                <h2 class="title">Movie Name</h2>

                <p class="year">
                    Year: <span></span>
                </p>

                <p class="rating">
                     Rating: <span></span>
                </p>

                <div class="plot">
                    <h3>Plot</h3>
                    <p></p>
                </div>

                <p class="runtime">
                    runtime: <span></span>
                </p>

                <p class="actors">
                    Actors : <span></span>
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
